name: Build offline HTML

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DashBoard-Usability-Screenshots
          path: test-results/usability
          if-no-files-found: ignore
      - run: cp dist/index.html DashBoard.html
      - uses: actions/upload-artifact@v4
        with:
          name: DashBoard-Offline-HTML
          path: DashBoard.html
          if-no-files-found: error
