name: Build offline HTML

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Bootstrap a real npm-resolved lockfile on the first run; subsequent runs are reproducible.
      - name: Bootstrap dependency lockfile
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Lock npm dependency tree for reproducible builds"
            git push
          fi
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DashBoard-Usability-Screenshots
          path: test-results/usability
          if-no-files-found: ignore
      - run: cp dist/index.html DashBoard.html
      - uses: actions/upload-artifact@v4
        with:
          name: DashBoard-Offline-HTML
          path: DashBoard.html
          if-no-files-found: error
